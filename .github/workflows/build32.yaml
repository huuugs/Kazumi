name: build-android-arm32

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions: write-all
    steps:
      - name: Clone repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build g++

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2.16.0
        id: flutter-action
        with:
          channel: stable
          flutter-version-file: pubspec.yaml

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Remove build id
        run: sed -i -e 's/-Wl,/-Wl,--build-id=none,/' ${{ steps.flutter-action.outputs.PUB-CACHE-PATH }}/hosted/pub.dev/jni-*/src/CMakeLists.txt

      - name: Build arm32 (armeabi-v7a) APK
        run: flutter build apk --release --split-per-abi --target-platform android-arm

      - name: Sign APK with stable key
        env:
          KAZUMI_TV_KEYSTORE: ${{ secrets.KAZUMI_TV_KEYSTORE }}
          KAZUMI_TV_KEYSTORE_PASS: ${{ secrets.KAZUMI_TV_KEYSTORE_PASS }}
        run: |
          echo "$KAZUMI_TV_KEYSTORE" | base64 -d > kazumi_tv.jks
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          echo "Using $APKSIGNER"
          "$APKSIGNER" sign \
            --ks kazumi_tv.jks \
            --ks-key-alias kazumi-tv \
            --ks-pass "pass:$KAZUMI_TV_KEYSTORE_PASS" \
            --key-pass "pass:$KAZUMI_TV_KEYSTORE_PASS" \
            build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
          "$APKSIGNER" verify --print-certs \
            build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk | head -4
          rm -f kazumi_tv.jks

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: kazumi-armeabi-v7a
          path: build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
